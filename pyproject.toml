[project]
name = "diffusiondb-api"
version = "0.1.0"
description = "API REST de consulta sobre los metadatos de DiffusionDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",  # zoneinfo en Windows (timestamps TIMESTAMPTZ del parquet)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusiondb_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=diffusiondb_api --cov-report=term-missing"
